name: Streak koi

# Builds koi/streak-koi.svg: the GitHub streak card with the koi swimming
# laps around the README box and passing behind the card.

on:
  schedule:
    # Refresh the streak numbers every 6 hours.
    - cron: "40 */6 * * *"
  workflow_run:
    workflows: [Koi]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/streak-koi.yml
      - .github/scripts/streak_koi.py

permissions:
  contents: write

concurrency: koi

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch the streak card
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/streak.svg \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=dracula&border_radius=5"
          grep -q "outer_rectangle" /tmp/streak.svg
      - name: Draw the koi around the streak card
        shell: bash
        run: |
          pip install --quiet pillow numpy
          python3 .github/scripts/streak_koi.py /tmp/streak.svg koi/koi.gif koi/streak-koi.svg
      - name: Commit if it changed
        shell: bash
        run: |
          git add koi/streak-koi.svg
          if git diff --cached --quiet; then
            echo "Unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: refresh streak koi"
          git pull --rebase --quiet
          git push --quiet
